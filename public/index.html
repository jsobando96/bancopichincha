<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Penales VR - Banco Pichincha</title>
<style>
@font-face{font-family:"Montserrat PV";src:url("/recursos/montserrat.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --amarillo:#ffdb09;--azul:#242d56;--gris:#eef2f3;--rojo:#de2a29;
  --u:min(1vw,.5625vh);
  --tipo:"Montserrat PV","Avenir Next","Century Gothic","Segoe UI",Roboto,sans-serif;
  --curva:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--amarillo);color:var(--azul);font-family:var(--tipo);font-variant-numeric:tabular-nums;overflow:hidden}
.columna{width:calc(var(--u)*100);height:100vh;margin:0 auto;display:flex;flex-direction:column}
.marca{display:block;width:100%;height:auto;flex:none}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*7);padding:0 calc(var(--u)*8)}

.jugador{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:0 calc(var(--u)*2.4);font-size:calc(var(--u)*4.6);font-weight:500}
.jugador b{font-weight:800}
.vivo{display:inline-flex;align-items:center;gap:calc(var(--u)*1.6);font-weight:700}
.vivo::before{content:"";width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;background:var(--rojo);animation:latido 1.2s ease-in-out infinite}
@keyframes latido{50%{opacity:.2}}

.marcador{display:flex;align-items:flex-end;gap:calc(var(--u)*4)}
.marcador strong{font-size:calc(var(--u)*46);font-weight:800;line-height:.74;letter-spacing:-.04em}
.marcador.doble strong{font-size:calc(var(--u)*34)}
.marcador span{font-size:calc(var(--u)*6.4);font-weight:600;line-height:1.1}

.tiros{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*2.6)}
.tiros.dos{grid-template-columns:1fr 1fr;column-gap:calc(var(--u)*5)}
.tiro{display:flex;align-items:center;gap:calc(var(--u)*4);font-size:calc(var(--u)*6);font-weight:600}
.dos .tiro{font-size:calc(var(--u)*4.6);gap:calc(var(--u)*3)}
.bola{flex:none;width:calc(var(--u)*11.5);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*5.2);font-weight:800}
.dos .bola{width:calc(var(--u)*9.5);font-size:calc(var(--u)*4.4)}
.atajado{font-weight:800}
.atajado .bola{background:var(--azul);color:var(--amarillo)}
.goal{font-weight:500}
.goal .bola{background:var(--gris);color:var(--azul)}
.vacio{font-weight:400}
.vacio .bola{border:calc(var(--u)*.5) dashed var(--azul);font-weight:500}
.siguiente{font-weight:700}
.siguiente .bola{border:calc(var(--u)*.8) solid var(--azul);animation:llama 1.2s ease-in-out infinite}
@keyframes llama{50%{transform:scale(1.1)}}

/* Jugador nuevo: entra toda la tanda. Mismo jugador: solo se anima el tiro que cambio. */
.nuevo .marcador strong{animation:golpe .5s var(--curva) both}
.nuevo .tiro{animation:entra .45s var(--curva) both;animation-delay:calc(200ms + var(--i) * 120ms)}
.sube strong{animation:golpe .5s var(--curva) both}
.cambio .bola{animation:revela .7s var(--curva) both}
.cambio{animation:resalta .7s var(--curva) both}
@keyframes golpe{from{opacity:0;transform:scale(.7)}}
@keyframes entra{from{opacity:0;transform:translateX(calc(var(--u)*-6))}}
@keyframes revela{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:none}}
@keyframes resalta{from{opacity:0;transform:translateX(calc(var(--u)*-3))}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important}}

.espera{margin:0;font-size:calc(var(--u)*7);font-weight:800;line-height:1.15;max-width:16ch}
.espera span{display:block;margin-top:calc(var(--u)*3);font-size:calc(var(--u)*4.6);font-weight:500;line-height:1.4;max-width:28ch}
footer{flex:none;display:flex;align-items:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*8) calc(var(--u)*6);
  font-size:calc(var(--u)*3.2);font-weight:500}
footer::before{content:"";flex:none;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:var(--azul)}
footer.caido::before{background:var(--rojo)}
</style>
</head>
<body>
<div class="columna">
  <img class="marca" src="/recursos/logo.png" width="1600" height="391" alt="Banco Pichincha y Mastercard">
  <main id="panel">
    <p class="espera">Todav&iacute;a no empieza ning&uacute;n jugador.<span>Los tiros aparecen aqu&iacute; en vivo apenas arranque la tanda.</span></p>
  </main>
  <footer id="conexion">Conectando</footer>
</div>
<script>
var ETIQUETA={atajado:"Atajada",goal:"Gol",vacio:"Sin tiro"};
var previo=null;
var panel=document.getElementById("panel");
var conexion=document.getElementById("conexion");

function pintar(d){
  var enJuego=d.estado==="en_juego";
  var mismo=previo!==null&&previo.id===d.id;
  var n=d.tiros.length;

  var siguiente=-1;
  if(enJuego){for(var k=0;k<n;k++){if(d.tiros[k].r==="vacio"){siguiente=k;break;}}}

  var filas="";
  for(var i=0;i<n;i++){
    var t=d.tiros[i], clase=t.r, texto=ETIQUETA[t.r];
    if(t.r==="vacio"&&enJuego){
      if(i===siguiente){clase+=" siguiente";texto="Siguiente tiro";}else{texto="Pendiente";}
    }
    if(mismo&&previo.tiros[i]&&previo.tiros[i].r!==t.r&&t.r!=="vacio"){clase+=" cambio";}
    filas+='<li class="tiro '+clase+'" style="--i:'+i+'"><span class="bola">'+(i+1)+'</span>'+texto+'</li>';
  }

  var cabecera=enJuego
    ?'<b>Jugador '+d.jugador+'</b><span class="vivo">en juego</span>'
    :'<b>Jugador '+d.jugador+'</b><span>termin\u00f3 a las '+String(d.hora).slice(0,5)+'</span>';

  var clasesMarcador="marcador"+(d.atajados>9?" doble":"")+(mismo&&previo.atajados!==d.atajados?" sube":"");

  panel.className=mismo?"":"nuevo";
  panel.innerHTML=
    '<p class="jugador">'+cabecera+'</p>'+
    '<div class="'+clasesMarcador+'"><strong>'+d.atajados+'</strong>'+
    '<span>'+(d.atajados===1?"atajada":"atajadas")+'<br>de '+n+' tiros</span></div>'+
    (n>0?'<ol class="tiros'+(n>5?' dos':'')+'">'+filas+'</ol>':'');
  previo=d;
}

function actualizar(){
  fetch("/api/tiros",{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(d){
      conexion.className="";
      conexion.textContent="En l\u00ednea";
      if(d.jugador>0&&(previo===null||d.version!==previo.version)){pintar(d);}
    })
    .catch(function(){
      // Si se cae el internet de la pantalla, se conserva lo ultimo recibido
      conexion.className="caido";
      conexion.textContent="Sin conexi\u00f3n a internet. Se muestra lo \u00faltimo recibido.";
    });
}
actualizar();
setInterval(actualizar,1000);
</script>
</body>
</html>
